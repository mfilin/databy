name: tests
on:
  push:
  pull_request:
jobs:
  t1:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Databy.Reports.sln
      - run: dotnet build Databy.Reports.sln --no-restore
      - run: dotnet test tests/Tests.Unit/Tests.Unit.csproj --no-build --filter Category=T1
  t2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Databy.Reports.sln
      - run: dotnet test tests/Tests.Integration/Tests.Integration.csproj --no-restore --filter Category=T2
