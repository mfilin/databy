code: leaders.sales
title: Лидеры продаж
routine:
  name: reports.fn_sales_leaders
  kind: function
  timeout_sec: 60
parameters:
  - name: p_from
    type: date
    label: Дата с
    required: true
    default: month_start
  - name: p_to
    type: date
    label: Дата по
    required: true
    default: today
result:
  sheet: Лидеры продаж
  columns:
    product: { title: Товар }
    category: { title: Категория }
    quantity: { title: Количество, format: "#,##0" }
    revenue: { title: Выручка, format: "#,##0.00" }
    deals: { title: Сделок, format: "#,##0" }
roles: [admin, user]